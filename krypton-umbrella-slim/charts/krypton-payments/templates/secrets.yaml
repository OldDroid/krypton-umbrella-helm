{{- /*
One Opaque Secret per entry in .Values.secrets, named
krypton-payments-<lane>-<key>. Same instance mechanism as the ConfigMaps.

The VaultStaticSecrets write their target Secrets under the very same
scheme (krypton-payments-<lane>-<key>), so a key present in both
.Values.secrets and .Values.vault.secrets would make two Secrets fight over
one name - the render is refused instead.
*/ -}}
{{- $root := . -}}
{{- range $name, $data := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "krypton-lib-slim.metadata" (dict "ctx" $root "component" "secret" "instance" $name) | nindent 2 }}
type: Opaque
stringData:
  {{- $data | default dict | toYaml | nindent 2 }}
{{- end }}
