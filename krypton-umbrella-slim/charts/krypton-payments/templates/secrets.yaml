{{- /*
One Opaque Secret per entry in .Values.secrets, named
krypton-payments-<lane>-secret-<key>. Same instance mechanism as the
ConfigMaps; the secret component type has no Kubernetes shortname, so the
kebab-cased type is used in the name.
*/ -}}
{{- $root := . -}}
{{- range $name, $data := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "krypton-lib-slim.metadata" (dict "ctx" $root "component" "secret" "instance" $name) | nindent 2 }}
type: Opaque
stringData:
  {{- $data | default dict | toYaml | nindent 2 }}
{{- end }}
