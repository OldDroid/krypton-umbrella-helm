{{- /*
Vault Secrets Operator CRD (secrets.hashicorp.com/v1beta1) - one
VaultStaticSecret per entry in .Values.vault.secrets, named with the entry
key as instance suffix. The sync wave resolves per component TYPE
(global.syncWaves.vaultStaticSecret, "-1"), so ArgoCD applies every instance
- and VSO materialises every target Secret - before the wave-1 Deployment
that mounts them; global.syncOptions.vaultStaticSecret adds Prune=false.
The path is rendered through tpl by this template (the slim library has no
tpl helper on purpose - the spec is the subchart's business).
*/ -}}
{{- $root := . -}}
{{- range $name, $secret := .Values.vault.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  {{- include "krypton-lib-slim.metadata" (dict "ctx" $root "component" "vaultStaticSecret" "instance" $name) | nindent 2 }}
spec:
  vaultAuthRef: {{ $secret.authRef | default $root.Values.vault.authRef }}
  mount: {{ $secret.mount | default $root.Values.vault.mount }}
  type: kv-v2
  path: {{ tpl $secret.path $root | quote }}
  refreshAfter: {{ $secret.refreshAfter | default $root.Values.vault.refreshAfter }}
  destination:
    # Same helper, same component type and instance as the Deployment's
    # secretRef: the two can never disagree on the Secret name.
    name: {{ include "krypton-lib-slim.componentName" (dict "ctx" $root "component" "vaultStaticSecret" "instance" $name) }}
    create: true
{{- end }}
