apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "krypton-lib-slim.metadata" (dict "ctx" . "component" "deployment") | nindent 2 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "krypton-lib-slim.selectorLabels" (dict "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "krypton-lib-slim.labels" (dict "ctx" .) | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config | default dict | toYaml | sha256sum }}
    spec:
      containers:
        - name: notifier-service
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "krypton-lib-slim.componentName" (dict "ctx" . "component" "configMap") }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
