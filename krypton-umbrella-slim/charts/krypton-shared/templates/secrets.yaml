{{- /*
One lane-independent Opaque Secret per entry in .Values.secrets, named
krypton-shared-<key>. The VaultStaticSecrets write their target Secrets
under the very same scheme, so a key present in both .Values.secrets and
.Values.vault.secrets would make two Secrets fight over one name - the
render is refused instead.
*/ -}}
{{- $root := . -}}
{{- $vaultSecrets := (.Values.vault | default dict).secrets | default dict -}}
{{- range $name, $_ := .Values.secrets }}
{{- if hasKey $vaultSecrets $name }}
{{- fail (printf "krypton-shared: secrets.%s and vault.secrets.%s would both produce the Secret %q - use distinct keys" $name $name (include "krypton-lib-slim.componentName" (dict "ctx" $root "component" "secret" "instance" $name "shared" true))) }}
{{- end }}
{{- end }}
{{- range $name, $data := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "krypton-lib-slim.metadata" (dict "ctx" $root "component" "secret" "instance" $name "shared" true) | nindent 2 }}
type: Opaque
stringData:
  {{- $data | default dict | toYaml | nindent 2 }}
{{- end }}
