{{- /*
One lane-independent Opaque Secret per entry in .Values.secrets, named
krypton-shared-<key>. The VaultStaticSecrets write their target Secrets
under the very same scheme, so a key present in both .Values.secrets and
.Values.vault.secrets would make two Secrets fight over one name - templates/validate.yaml rejects duplicate final names, including
collisions after instance normalization. Overlong names fail rendering.
*/ -}}
{{- $root := . -}}
{{- range $name, $data := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "krypton-lib-slim.metadata" (dict "ctx" $root "component" "secret" "instance" $name "shared" true) | nindent 2 }}
type: Opaque
stringData:
  {{- $data | default dict | toYaml | nindent 2 }}
{{- end }}
