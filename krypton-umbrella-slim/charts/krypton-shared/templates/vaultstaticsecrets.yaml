{{- /*
Vault Secrets Operator CRD (secrets.hashicorp.com/v1beta1) - one
lane-independent VaultStaticSecret per entry in .Values.vault.secrets,
writing the Secret krypton-shared-<key>. Paths go through tpl but carry no
lane by default; the type-level wave (vaultStaticSecret, "-1") applies.
*/ -}}
{{- $root := . -}}
{{- range $name, $secret := .Values.vault.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  {{- include "krypton-lib-slim.metadata" (dict "ctx" $root "component" "vaultStaticSecret" "instance" $name "shared" true) | nindent 2 }}
spec:
  vaultAuthRef: {{ $secret.authRef | default $root.Values.vault.authRef }}
  mount: {{ $secret.mount | default $root.Values.vault.mount }}
  type: kv-v2
  path: {{ tpl $secret.path $root | quote }}
  refreshAfter: {{ $secret.refreshAfter | default $root.Values.vault.refreshAfter }}
  destination:
    # Same helper, same component type and instance as the consumers'
    # secretRef (sharedEnvFrom.secrets): the two can never disagree.
    name: {{ include "krypton-lib-slim.componentName" (dict "ctx" $root "component" "vaultStaticSecret" "instance" $name "shared" true) }}
    create: true
{{- end }}
