{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # serviceAccountName (not componentName) so a custom serviceAccount.name
  # is honoured; labels/annotations come from the granular helpers.
  name: {{ include "krypton-lib.serviceAccountName" (dict "ctx" .) }}
  labels:
    {{- include "krypton-lib.labels" (dict "ctx" . "component" "serviceAccount") | nindent 4 }}
  annotations:
    {{- include "krypton-lib.annotations" (dict "ctx" . "component" "serviceAccount") | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
