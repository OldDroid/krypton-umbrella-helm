apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "krypton-lib.metadata" (dict "ctx" . "component" "deployment") | nindent 2 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "krypton-lib.selectorLabels" (dict "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "krypton-lib.labels" (dict "ctx" .) | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "krypton-lib.serviceAccountName" (dict "ctx" .) }}
      containers:
        - name: auth-service
          image: "{{ include "krypton-lib.image" (dict "ctx" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.probes | default dict).readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.probes | default dict).liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.probes | default dict).startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $sharedEnvFrom := .Values.sharedEnvFrom | default dict }}
          {{- if or $sharedEnvFrom.configMaps $sharedEnvFrom.secrets .Values.extraEnvFrom }}
          envFrom:
            # Lane-independent objects owned by the krypton-shared subchart:
            # the same helper krypton-shared names them with, "chart" pins
            # the owner - the reference can never drift from the real name.
            {{- range $sharedEnvFrom.configMaps }}
            - configMapRef:
                name: {{ include "krypton-lib.componentName" (dict "ctx" $ "chart" "krypton-shared" "component" "configMap" "instance" . "shared" true) }}
            {{- end }}
            {{- range $sharedEnvFrom.secrets }}
            - secretRef:
                name: {{ include "krypton-lib.componentName" (dict "ctx" $ "chart" "krypton-shared" "component" "secret" "instance" . "shared" true) }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
