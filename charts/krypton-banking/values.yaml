replicaCount: 1

image:
  # Registry host. global.imageRegistry in the umbrella overrides it for ALL
  # subcharts at once - the per-lane proxy / air-gapped registry switch.
  registry: registry.example.com
  repository: krypton/banking-service
  tag: "1.4.2"
  # digest: "sha256:..."   # takes precedence over tag when set
  pullPolicy: IfNotPresent

# Compute sizing. Lanes override this from the umbrella (the release lane
# sizes up, test lanes can shrink it) - important on OpenShift with
# ResourceQuotas and LimitRanges in play.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ServiceAccount the workload pods run as. create=true renders a dedicated
# SA (component type serviceAccount, sync wave -2, so it exists before the
# Vault objects that authenticate with it) named
# <subchart>-<lane> - bind the VaultAuth Kubernetes role to
# exactly that name. create=false references an existing SA instead
# (name empty -> the namespace "default" SA).
serviceAccount:
  create: true
  name: ""

# ConfigMap delivery. data is rendered 1:1 into the ConfigMap; the flags
# control how it reaches the pods and what happens when it changes.
config:
  data:
    BANKING_LOG_LEVEL: info
    BANKING_FEATURE_INSTANT_PAYMENTS: "true"

  # false -> the ConfigMap is NOT lane specific: it is named without the
  #          lane (krypton-banking instead of krypton-banking-<lane>)
  #          and carries no lane label, so every lane deployment of this
  #          subchart consumes the same ConfigMap.
  # true  -> one ConfigMap per lane (the default).
  shared: false

  # Whether this deployment renders the ConfigMap at all. Keep true for
  # lane-specific config. For a shared ConfigMap exactly ONE lane creates
  # it (create: true) and every other lane sets create: false from the
  # umbrella - the Deployment still references the shared name.
  create: true

  # Expose the keys to the container as environment variables (envFrom).
  # Env vars NEVER update inside a running container - envFrom consumers
  # need rollPodsOnChange: true to pick up changes at all.
  envFrom: true

  # true  -> the pod template carries a checksum/config annotation, so every
  #          config change rolls the pods (the safe default).
  # false -> pods keep running through config changes. Only sensible when
  #          the service watches its mounted config file itself (set
  #          mountPath): the kubelet refreshes mounted ConfigMap files,
  #          typically within a minute.
  rollPodsOnChange: true

  # Non-empty -> additionally mounts the ConfigMap as files (one file per
  # key) at this absolute path, e.g. /etc/krypton/config - the prerequisite
  # for in-process hot reload. Whole-directory mount on purpose: subPath
  # mounts would never refresh.
  mountPath: ""

service:
  type: ClusterIP
  port: 8080

route:
  host: ""            # empty -> OpenShift generates <name>-<namespace>.<appsDomain>; may contain template syntax (rendered via tpl)
  targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  # Route-specific annotations, e.g. a longer HAProxy timeout. Handed to the
  # metadata helper as annotationsFrom "route.annotations": merged after
  # global.annotations and jenkins.annotations, below the two ArgoCD keys.
  # With several Routes per subchart the same mechanism annotates exactly
  # one of them: (printf "routes.%s.annotations" $name) inside the range.
  annotations: {}
  #  haproxy.router.openshift.io/timeout: 300s

# Probe specs are passed through verbatim to the container. Readiness is what
# makes the sync waves real: ArgoCD only starts the next wave once the
# current one is healthy, and without a readiness probe "healthy" merely
# means "container started". Overridable per lane via the umbrella.
probes:
  readiness:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20

vault:
  # Connection defaults shared by every VaultStaticSecret of this subchart;
  # each entry under secrets: may override them individually.
  authRef: krypton-vault-auth
  mount: kv-v2
  refreshAfter: 60s

  # One VaultStaticSecret per entry. The key becomes the instance suffix of
  # the resource name: krypton-banking-<lane>-<key> (VaultStaticSecret and
  # the Secret it writes).
  # Paths are rendered through tpl -> lane-aware by default, so every lane
  # reads its own secrets (override per lane in the umbrella with a plain
  # string if needed). envFrom: true wires the resulting Secret into the
  # Deployment; false keeps it for other consumers (volumes, other pods).
  # All entries share the type-level syncWaves.vaultStaticSecret wave and
  # the global.syncPrune.vaultStaticSecret prune protection.
  secrets:
    app:
      path: "krypton/{{ .Values.global.laneName }}/banking/app"
      envFrom: true
    database:
      path: "krypton/{{ .Values.global.laneName }}/banking/database"
      refreshAfter: 30s
      envFrom: true

# ---------------------------------------------------------------------------
# Optional components - enabled-flag pattern, steered per lane from the
# umbrella just like the subchart-level enabled flag.
# ---------------------------------------------------------------------------

# PodDisruptionBudget (component type podDisruptionBudget). The release
# lane enables it from the umbrella; single-replica test lanes leave it off.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1   # alternative to minAvailable

# HorizontalPodAutoscaler (component type horizontalPodAutoscaler). While
# enabled, the Deployment stops rendering spec.replicas so ArgoCD and the
# HPA never fight over the replica count.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

# ---------------------------------------------------------------------------
# Passthroughs - copied verbatim into the pod spec so app teams never need
# to fork the template.
# ---------------------------------------------------------------------------
extraEnv: []
#  - name: BANKING_TZ
#    value: Europe/Berlin
extraEnvFrom: []
#  - secretRef:
#      name: some-extra-secret
podAnnotations: {}

# Lane-independent objects of the krypton-shared subchart this workload
# consumes as envFrom, by instance key. The names (krypton-shared-<key>) are
# computed with the very helper krypton-shared uses, so a reference can
# never drift; whether the objects exist is the shared owner's business
# (krypton-shared.enabled in the umbrella). The umbrella wires common and
# gateway in.
sharedEnvFrom:
  configMaps: []
  secrets: []
nodeSelector: {}
tolerations: []
affinity: {}

# Default sync waves for this subchart's components. Keys are the component
# types as passed to the krypton-lib helpers. Components not listed here fall
# back to global.syncWaves. The umbrella may override any key under
# krypton-banking.syncWaves - it bumps route to "3".
syncWaves:
  vaultStaticSecret: "-1"   # secrets first: the Deployment mounts the resulting Secret
  route: "2"                # overridden to "3" by the umbrella values.yaml

# Prune protection works the same way: syncPrune.<component>: false marks the
# rendered resource with argocd.argoproj.io/sync-options: Prune=false.
# Nothing is set here on purpose - vaultStaticSecret inherits the platform
# default from global.syncPrune, and the umbrella adds route: false on top.

# Optional CI block. When jenkins.annotations exists (usually injected from
# the umbrella as krypton-banking.jenkins.annotations via ArgoCD helm
# parameters), its entries are merged into every resource's annotations;
# when absent, nothing is rendered. Deliberately not declared here, so the
# default manifests carry no CI annotations.
# jenkins:
#   annotations:
#     jenkins.io/build-number: "1234"
