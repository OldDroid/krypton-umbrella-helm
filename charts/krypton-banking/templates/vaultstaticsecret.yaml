{{- /*
Mocks of the Vault Secrets Operator CRD (secrets.hashicorp.com/v1beta1) -
one VaultStaticSecret per entry in .Values.vault.secrets, named with the
entry key as instance suffix. The sync wave resolves per component TYPE
(syncWaves.vaultStaticSecret, "-1"), so ArgoCD applies every instance - and
VSO materialises every target Secret - before the wave-1 Deployment that
mounts them. Connection settings default to the shared vault.* values.
*/ -}}
{{- $root := . -}}
{{- range $name, $secret := .Values.vault.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  {{- include "krypton-lib.metadata" (dict "ctx" $root "component" "vaultStaticSecret" "instance" $name) | nindent 2 }}
spec:
  vaultAuthRef: {{ $secret.authRef | default $root.Values.vault.authRef }}
  mount: {{ $secret.mount | default $root.Values.vault.mount }}
  type: kv-v2
  # tpl-rendered: the default paths template the lane name in, so release
  # and test never read the same secrets.
  path: {{ include "krypton-lib.tplValue" (dict "ctx" $root "value" $secret.path) }}
  refreshAfter: {{ $secret.refreshAfter | default $root.Values.vault.refreshAfter }}
  destination:
    # Same helper, same component type and instance: this destination and
    # the Deployment's secretRef can never disagree on the Secret name.
    name: {{ include "krypton-lib.componentName" (dict "ctx" $root "component" "vaultStaticSecret" "instance" $name) }}
    create: true
{{- end }}
