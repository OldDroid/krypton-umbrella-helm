{{- $config := .Values.config | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "krypton-lib.metadata" (dict "ctx" . "component" "deployment") | nindent 2 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "krypton-lib.selectorLabels" (dict "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "krypton-lib.labels" (dict "ctx" . "component" "deployment") | nindent 8 }}
      {{- if or $config.rollPodsOnChange .Values.podAnnotations }}
      annotations:
        {{- if $config.rollPodsOnChange }}
        # Rolls the pods whenever the ConfigMap content changes - required
        # for envFrom consumers (env vars never update in a running
        # container). Disabled via config.rollPodsOnChange only for
        # services that watch their mounted config file themselves.
        checksum/config: {{ $config.data | default dict | toYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "krypton-lib.serviceAccountName" (dict "ctx" .) }}
      containers:
        - name: banking-service
          image: "{{ include "krypton-lib.image" (dict "ctx" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.probes | default dict).readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.probes | default dict).liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.probes | default dict).startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $vaultEnvFrom := false }}
          {{- range $n, $s := .Values.vault.secrets }}{{- if $s.envFrom }}{{- $vaultEnvFrom = true }}{{- end }}{{- end }}
          {{- if or $config.envFrom $vaultEnvFrom .Values.extraEnvFrom }}
          envFrom:
            {{- if $config.envFrom }}
            - configMapRef:
                name: {{ include "krypton-lib.componentName" (dict "ctx" . "component" "configmap") }}
            {{- end }}
            # Secrets materialised by the VaultStaticSecrets (sync wave -1),
            # so they already exist when this Deployment (wave 1) syncs.
            {{- range $name, $secret := .Values.vault.secrets }}
            {{- if $secret.envFrom }}
            - secretRef:
                name: {{ include "krypton-lib.componentName" (dict "ctx" $ "component" "vaultStaticSecret" "instance" $name) }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $config.mountPath }}
          volumeMounts:
            # Whole-directory ConfigMap mount: the kubelet refreshes these
            # files after config changes (a subPath mount never would) -
            # the prerequisite for in-process hot reload.
            - name: config
              mountPath: {{ . }}
              readOnly: true
          {{- end }}
      {{- with $config.mountPath }}
      volumes:
        - name: config
          configMap:
            name: {{ include "krypton-lib.componentName" (dict "ctx" $ "component" "configmap") }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
