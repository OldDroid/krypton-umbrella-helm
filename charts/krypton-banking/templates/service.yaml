apiVersion: v1
kind: Service
metadata:
  {{- include "krypton-lib.metadata" (dict "ctx" . "component" "service") | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "krypton-lib.selectorLabels" (dict "ctx" .) | nindent 4 }}
